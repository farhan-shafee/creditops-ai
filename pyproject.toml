[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "creditops-ai"
version = "1.0.0"
description = "Synthetic credit trading incident intelligence and read-only diagnostics"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "pydantic>=2.10,<3",
  "pydantic-settings>=2.8,<3", "sqlalchemy[asyncio]>=2.0.38,<3", "alembic>=1.15,<2",
  "aiosqlite>=0.21,<1", "asyncpg>=0.30,<1", "pgvector>=0.4,<1",
  "httpx>=0.28,<1", "openai>=2,<3", "anthropic>=1,<2", "mcp>=2.3,<3",
  "prometheus-client>=0.22,<1", "aiokafka>=0.13,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=1,<2", "ruff>=0.11,<1", "pip-audit>=2.9,<3", "bandit>=1.8,<2"]

[tool.setuptools.packages.find]
where = ["apps/api", "apps/mcp"]

[tool.pytest.ini_options]
testpaths = ["apps/api/tests", "apps/mcp/tests"]
pythonpath = ["apps/api", "apps/mcp"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]
