services:
  - type: web
    name: creditops-ai-api
    runtime: docker
    dockerfilePath: ./infra/docker/api.Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: TELEMETRY_MODE
        value: persisted
      - key: PUBLIC_DEMO
        value: "true"
      - key: REPLAY_DIR
        value: /app/data/showcase
      - key: CREDITOPS_ENV_FILE
        value: ""
      - key: EMBEDDINGS_ENABLED
        value: "false"
      - key: DATABASE_REQUIRE_SSL
        value: "true"
      - key: CORS_ORIGINS
        sync: false
