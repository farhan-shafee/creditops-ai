name: CreditOps verification
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: creditops_ci
          POSTGRES_USER: creditops
          POSTGRES_PASSWORD: disposable-synthetic-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U creditops -d creditops_ci"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://creditops:disposable-synthetic-ci-only@127.0.0.1:5432/creditops_ci
      CREDITOPS_TEST_DATABASE_URL: postgresql+asyncpg://creditops:disposable-synthetic-ci-only@127.0.0.1:5432/creditops_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install -c requirements.lock -e '.[dev]'
      - run: python -m ruff check apps scripts
      - run: python -m alembic upgrade head
      - run: python -m pytest --junitxml=artifacts/test-results/python.xml
      - run: python scripts/evaluate.py
      - run: python -m pip_audit
      - run: python -m bandit -r apps/api/creditops apps/mcp/creditops_mcp -ll
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-verification
          path: |
            artifacts/test-results
            artifacts/eval
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:dependencies
      - run: pnpm --filter @creditops/web lint
      - run: pnpm typecheck
      - run: pnpm --filter @creditops/web test
      - run: pnpm build
      - run: pnpm audit --audit-level high
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: python -m venv .venv && .venv/bin/python -m pip install -c requirements.lock -e '.[dev]'
      - run: pnpm install --frozen-lockfile
      - run: node scripts/python.mjs scripts/seed.py && node scripts/python.mjs scripts/evaluate.py
      - run: pnpm --filter @creditops/web exec playwright install --with-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-verification
          path: |
            apps/web/playwright-report
            apps/web/test-results
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan tracked source and Git history
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 detect --source /repo --config /repo/.gitleaks.toml --redact --exit-code 1
